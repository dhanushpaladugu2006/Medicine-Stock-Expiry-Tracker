spring:
  application:
    name: medicine-stock-expiry-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medicine_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:U3VwZXJTZWNyZXRLZXlGb3JNZWRpY2luZVRyYWNrZXJTcHJpbmdCb290SldUMjAyNg==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: ${UPLOAD_MAX_MB:10}
  notification:
    sender-email: ${MAIL_SENDER:no-reply@medicinetracker.local}
    enable-email: ${ENABLE_EMAIL_NOTIFICATIONS:false}
    enable-sms-placeholder: ${ENABLE_SMS_PLACEHOLDER:false}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
  scheduler:
    zone-id: ${APP_TIME_ZONE:Asia/Kolkata}
    expiry-cron: ${EXPIRY_CRON:0 0 8 * * *}
