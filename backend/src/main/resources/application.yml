spring:
  application:
    name: medicine-stock-expiry-tracker
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/medicine_tracker}
    database: ${MONGO_DATABASE:medicine_tracker}
    auto-index-creation: true
    uuid-representation: standard

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
    mongo:
      enabled: false



springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:U3VwZXJTZWNyZXRLZXlGb3JNZWRpY2luZVRyYWNrZXJTcHJpbmdCb290SldUMjAyNg==}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    max-file-size-mb: ${UPLOAD_MAX_MB:10}
  notification:
    sender-email: ${MAIL_SENDER:no-reply@medicinetracker.local}
    enable-email: ${ENABLE_EMAIL_NOTIFICATIONS:false}
    enable-sms-placeholder: ${ENABLE_SMS_PLACEHOLDER:false}
  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:5173}
  scheduler:
    zone-id: ${APP_TIME_ZONE:Asia/Kolkata}
    expiry-cron: ${EXPIRY_CRON:0 0 8 * * *}
