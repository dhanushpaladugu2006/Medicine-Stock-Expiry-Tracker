version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: medicine-tracker-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: medicine-tracker-backend
    environment:
      SERVER_PORT: 8080
      MONGO_URI: mongodb://mongodb:27017/medicine_tracker
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-U3VwZXJTZWNyZXRLZXlGb3JNZWRpY2luZVRyYWNrZXJTcHJpbmdCb290SldUMjAyNg==}
      UPLOAD_DIR: /app/uploads
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-true}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SENDER: ${MAIL_SENDER:-no-reply@medicinetracker.local}
    ports:
      - '8080:8080'
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: medicine-tracker-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog
    container_name: medicine-tracker-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mongo_data:
  backend_uploads:
