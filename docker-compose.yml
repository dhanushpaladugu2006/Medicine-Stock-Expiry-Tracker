version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: medicine-tracker-mysql
    environment:
      MYSQL_DATABASE: medicine_tracker
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: '%'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: medicine-tracker-backend
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/medicine_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: root
      DB_PASSWORD: root
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-U3VwZXJTZWNyZXRLZXlGb3JNZWRpY2luZVRyYWNrZXJTcHJpbmdCb290SldUMjAyNg==}
      UPLOAD_DIR: /app/uploads
      ENABLE_EMAIL_NOTIFICATIONS: ${ENABLE_EMAIL_NOTIFICATIONS:-false}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SENDER: ${MAIL_SENDER:-no-reply@medicinetracker.local}
    ports:
      - '8080:8080'
    depends_on:
      - mysql
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: medicine-tracker-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog
    container_name: medicine-tracker-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  mysql_data:
  backend_uploads:
